apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-job
spec:
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    metadata:
      creationTimestamp: null
    spec:
      containers:
      - command:
        - /bin//bash
        - -c
        args:
          -
           'curl -skL -o /tmp/idp.tgz https://shibboleth.net/downloads/identity-provider/latest5/shibboleth-identity-provider-5.1.6.tar.gz;
            tar -xvf /tmp/idp.tgz -C ./tmp/ --strip-components=1
            /tmp/bin/install.sh \
              --noPrompt \
              -t /opt/shibboleth-idp \
              -h idp-intern.klinghed.se \
              -e idp-intern.klinghed.se/idp \
              -kp qwe123 \
              -sp qwe123
           ' 
        image: "{{ .Values.image.address }}:{{ .Values.image.tag }}" 
        imagePullPolicy: IfNotPresent
        name: {{ .Release.Name }}-job
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30